name: Deploy via gh-pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 必須在 setup-node 之前安裝，cache: 'pnpm' 需要 pnpm 可執行檔；版本取自 package.json 的 packageManager
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (vite)
        run: pnpm build

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # gh-pages 會另外 clone 一份 repo，拿不到 checkout 設定的認證，需在 remote URL 帶 token
      - name: Deploy to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          pnpm exec gh-pages -d dist
          -r "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          -u "github-actions-bot <support+actions@github.com>"

    # 成功後可在倉庫設定中選擇 gh-pages branch 作為 Pages 來源
